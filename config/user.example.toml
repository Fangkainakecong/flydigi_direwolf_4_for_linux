# 个人映射覆盖层（复制为 config/user.toml 后修改）
#
# 只写想改的键，daemon 会和 config/default.toml 深合并：
#   [profile.desktop]
#   a = "key:f"
#   home = "none"
#
# 改完检查并预览：
#   python3 -m flydigi_daemon show
#   python3 -m flydigi_daemon check
#
# 所有轴参数都可以在这里覆盖（不要改 default.toml）：

# ---------------------------------------------------------------------------
# 自动启停
# ---------------------------------------------------------------------------
# [daemon]
# idle_exit_s = 3600    # 1 小时没有有效操作就停下映射（0 = 不自动退出）
#
# [device]
# product_hint = "Direwolf 4"   # 只接管这个产品名的 045e:028e，避免黑武士2混用

# ---------------------------------------------------------------------------
# 左摇杆 → 鼠标（与体感相加）
# ---------------------------------------------------------------------------
# [profile.desktop.axis.lx]
# target = "mouse:x"
# deadzone = 0.08       # 0..1，越小越灵敏
# curve = 1.4           # 1=线性；越大，轻推越慢、重推越快
# max_speed = 3200      # 满推像素/秒
#
# [profile.desktop.axis.ly]
# target = "mouse:y"
# invert = true
# deadzone = 0.08
# curve = 1.4
# max_speed = 3200

# ---------------------------------------------------------------------------
# 扳机 → 滚轮（比例：轻按慢滚，深按快滚）
# ---------------------------------------------------------------------------
# [profile.desktop.axis.lt]
# target = "wheel:up"
# deadzone = 0.12       # 低于这个幅度不滚
# max_hz = 40           # 按到底每秒滚多少格
# curve = 1.5           # 越大，轻按越慢
#
# [profile.desktop.axis.rt]
# target = "wheel:down"
# deadzone = 0.12
# max_hz = 40
# curve = 1.5

# ---------------------------------------------------------------------------
# 体感 → 鼠标（先运行 calibrate）
# ---------------------------------------------------------------------------
# [profile.desktop.axis.gyro_x]
# target = "mouse:x"
# group = "gyro"
# sensitivity = 10.0    # 像素/度
# smoothing = 0.35
# deadband = 1.5
#
# [profile.desktop.axis.gyro_y]
# target = "mouse:y"
# group = "gyro"
# sensitivity = 8.0
# smoothing = 0.35
# deadband = 1.5

# 注意：不要在 user.toml 里改 [virtual.*] 的设备名/VID:PID，
# Steam 靠它识别；也不要改 [device] 的 VID/PID。
